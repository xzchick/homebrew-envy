name: Sync casks to latest releases

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-casks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync casks to latest releases
        run: python tools/sync-casks.py
      - name: Commit any updates
        run: |
          if git diff --quiet; then
            echo "No cask changes."
          else
            git config user.name "Envy"
            git config user.email "235594225+xzchick@users.noreply.github.com"
            git commit -am "Sync casks to latest releases"
            git push
          fi
